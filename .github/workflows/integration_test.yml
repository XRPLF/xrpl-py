name: Integration test

env:
  POETRY_VERSION: 2.1.1

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      git_ref:
        description: "Git ref (branch, tag, or SHA) to test"
        required: false
        type: string
        default: ""

jobs:
  resolve_xrpld_image:
    name: Resolve xrpld image
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      is_private: ${{ steps.resolve.outputs.is_private }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Resolve xrpld image
        id: resolve
        env:
          IMAGE_CONFIG_FILE: .github/xrpld-image.env
          DEFAULT_IMAGE: rippleci/xrpld:develop
          PRIVATE_IMAGE_REPO: registry.gitlab.com/ripple/xrpledger/xrpld_package_deploy/xrpld-private
          GITLAB_REGISTRY_USERNAME: ${{ vars.GITLAB_REGISTRY_USERNAME }}
          GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # Read the requested private version from the committed config file.
          # The file is never sourced: on fork pull requests its contents are
          # untrusted, so we only extract the value and validate it strictly.
          PRIVATE_VERSION=""
          if [[ -f "${IMAGE_CONFIG_FILE}" ]]; then
            RAW_LINE="$(grep -E '^[[:space:]]*XRPLD_PRIVATE_VERSION[[:space:]]*=' "${IMAGE_CONFIG_FILE}" | tail -n1 || true)"
            PRIVATE_VERSION="$(printf '%s' "${RAW_LINE#*=}" | tr -d "[:space:]\"'")"
          fi

          if [[ -z "${PRIVATE_VERSION}" ]]; then
            echo "No private xrpld version configured in ${IMAGE_CONFIG_FILE}; using default image ${DEFAULT_IMAGE}."
            {
              echo "image=${DEFAULT_IMAGE}"
              echo "is_private=false"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! [[ "${PRIVATE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(b|rc)[0-9]+)?$ ]]; then
            echo "XRPLD_PRIVATE_VERSION in ${IMAGE_CONFIG_FILE} must use X.Y.Z, X.Y.Z-bN, or X.Y.Z-rcN format (got '${PRIVATE_VERSION}')." >&2
            exit 1
          fi

          if [[ -z "${GITLAB_REGISTRY_USERNAME}" || -z "${GITLAB_REGISTRY_TOKEN}" ]]; then
            echo "A private xrpld version (${PRIVATE_VERSION}) is configured but the GITLAB_REGISTRY_USERNAME variable and GITLAB_REGISTRY_TOKEN secret are unavailable. These are not exposed to fork pull requests; run the private build from a branch in this repository, or clear XRPLD_PRIVATE_VERSION to use the default image." >&2
            exit 1
          fi

          echo "Using private xrpld image for version ${PRIVATE_VERSION}."
          {
            echo "image=${PRIVATE_IMAGE_REPO}:private-${PRIVATE_VERSION}"
            echo "is_private=true"
          } >> "${GITHUB_OUTPUT}"

  integration-test:
    name: Integration test
    needs: resolve_xrpld_image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XRPLD_DOCKER_IMAGE: ${{ needs.resolve_xrpld_image.outputs.image }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Load cached .local
        id: cache-poetry
        uses: actions/cache@v4
        with:
          path: /home/runner/.local
          key: dotlocal-${{ env.POETRY_VERSION }}

      - name: Log in to the private GitLab registry
        if: ${{ needs.resolve_xrpld_image.outputs.is_private == 'true' }}
        env:
          GITLAB_REGISTRY_USERNAME: ${{ vars.GITLAB_REGISTRY_USERNAME }}
          GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
        run: |
          printf '%s' "${GITLAB_REGISTRY_TOKEN}" | docker login registry.gitlab.com \
            --username "${GITLAB_REGISTRY_USERNAME}" \
            --password-stdin

      - name: Run docker in background
        run: |
          docker run \
            --detach \
            --publish 5005:5005 \
            --publish 6006:6006 \
            --volume "${{ github.workspace }}/.ci-config/":"/etc/xrpld/" \
            --name xrpld-service \
            "${XRPLD_DOCKER_IMAGE}" --standalone

      - name: Install poetry
        if: steps.cache-poetry.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://install.python-poetry.org/ | python - --version ${{ env.POETRY_VERSION }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python + Retrieve Poetry dependencies from cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"

      - name: Display Python version
        run: |
          python -c "import sys; print(sys.version)"

      - name: Install poetry dependencies
        run: poetry install

      - name: Integration test
        run: |
          poetry run poe test_integration
          poetry run coverage report --fail-under=70

      - name: Stop docker container
        if: always()
        run: docker logs xrpld-service && docker stop xrpld-service

  # ────────────────────────────────────────────────────────────────────────────
  # Confidential MPT (XLS-0096) integration test — Linux only.
  #
  # The ConfidentialMPT* models and the fee-in-autofill logic live in CORE
  # xrpl-py, so this job (which runs on every PR) is the regression net for
  # core-side changes that the confidential-paths-filtered
  # build_wheels_confidential.yml would not trigger on. Cross-platform NATIVE
  # coverage (macOS / Windows / ARM, consuming the built wheels) lives in that
  # workflow's `confidential-native-it` job instead.
  #
  # The native add-on ships as the separate xrpl-py-confidential distribution and
  # is not a core dependency, so it's built from source here — Linux x86-64 only,
  # the most reliable from-source target. Gated on the private image, which
  # provides the ConfidentialTransfer amendment.
  # ────────────────────────────────────────────────────────────────────────────
  confidential-integration-test:
    name: Confidential MPT integration test (linux-x86-64)
    needs: resolve_xrpld_image
    if: ${{ needs.resolve_xrpld_image.outputs.is_private == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XRPLD_DOCKER_IMAGE: ${{ needs.resolve_xrpld_image.outputs.image }}
      # `gh release download` of the mpt-crypto native bundle (public repo).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Log in to the private GitLab registry
        env:
          GITLAB_REGISTRY_USERNAME: ${{ vars.GITLAB_REGISTRY_USERNAME }}
          GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
        run: |
          printf '%s' "${GITLAB_REGISTRY_TOKEN}" | docker login registry.gitlab.com \
            --username "${GITLAB_REGISTRY_USERNAME}" \
            --password-stdin

      - name: Run rippled (standalone)
        run: |
          docker run \
            --detach \
            --publish 5005:5005 \
            --publish 6006:6006 \
            --volume "${{ github.workspace }}/.ci-config/":"/etc/xrpld/" \
            --name xrpld-service \
            "${XRPLD_DOCKER_IMAGE}" --standalone

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Install poetry dependencies
        run: poetry install

      # cffi + setuptools are BUILD-time deps of the native ext only (setuptools
      # backs cffi's ffibuilder.compile() and is absent from a fresh venv); they
      # are intentionally not core xrpl-py dependencies.
      - name: Install cffi (build-time only)
        run: poetry run pip install cffi setuptools

      - name: Fetch pinned native mpt-crypto library
        run: |
          VERSION=$(grep -E '^MPT_CRYPTO_VERSION=' \
            xrpl/ext/confidential/MPT_CRYPTO_VERSION | cut -d= -f2)
          echo "Fetching mpt-crypto natives for pinned version ${VERSION}"
          ./xrpl/ext/confidential/setup_mpt_crypto.sh download --version "${VERSION}"

      - name: Build the CFFI extension
        run: poetry run python xrpl/ext/confidential/build_mpt_crypto.py

      # Fail loudly if the extension did not build/load, so the integration test
      # below cannot silently self-skip and report a false green.
      - name: Verify the native extension is available
        run: |
          poetry run python -c "from xrpl.ext.confidential import MPT_CRYPTO_AVAILABLE; assert MPT_CRYPTO_AVAILABLE, 'native mpt-crypto extension failed to build/load'; print('MPT_CRYPTO_AVAILABLE = True')"

      - name: Confidential MPT integration test
        run: |
          poetry run python -m unittest -v \
            tests.integration.transactions.test_confidential_mpt

      - name: rippled logs + stop
        if: always()
        run: docker logs xrpld-service && docker stop xrpld-service
