name: Integration test

env:
  POETRY_VERSION: 2.1.1

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      git_ref:
        description: "Git ref (branch, tag, or SHA) to test"
        required: false
        type: string
        default: ""

jobs:
  resolve_xrpld_image:
    name: Resolve xrpld image
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      is_private: ${{ steps.resolve.outputs.is_private }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Resolve xrpld image
        id: resolve
        env:
          IMAGE_CONFIG_FILE: .github/xrpld-image.env
          DEFAULT_IMAGE: rippleci/xrpld:develop
          PRIVATE_IMAGE_REPO: registry.gitlab.com/ripple/xrpledger/xrpld_package_deploy/xrpld-private
          GITLAB_REGISTRY_USERNAME: ${{ vars.GITLAB_REGISTRY_USERNAME }}
          GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # Read the requested private version from the committed config file.
          # The file is never sourced: on fork pull requests its contents are
          # untrusted, so we only extract the value and validate it strictly.
          PRIVATE_VERSION=""
          if [[ -f "${IMAGE_CONFIG_FILE}" ]]; then
            RAW_LINE="$(grep -E '^[[:space:]]*XRPLD_PRIVATE_VERSION[[:space:]]*=' "${IMAGE_CONFIG_FILE}" | tail -n1 || true)"
            PRIVATE_VERSION="$(printf '%s' "${RAW_LINE#*=}" | tr -d "[:space:]\"'")"
          fi

          if [[ -z "${PRIVATE_VERSION}" ]]; then
            echo "No private xrpld version configured in ${IMAGE_CONFIG_FILE}; using default image ${DEFAULT_IMAGE}."
            {
              echo "image=${DEFAULT_IMAGE}"
              echo "is_private=false"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! [[ "${PRIVATE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(b|rc)[0-9]+)?$ ]]; then
            echo "XRPLD_PRIVATE_VERSION in ${IMAGE_CONFIG_FILE} must use X.Y.Z, X.Y.Z-bN, or X.Y.Z-rcN format (got '${PRIVATE_VERSION}')." >&2
            exit 1
          fi

          if [[ -z "${GITLAB_REGISTRY_USERNAME}" || -z "${GITLAB_REGISTRY_TOKEN}" ]]; then
            echo "A private xrpld version (${PRIVATE_VERSION}) is configured but the GITLAB_REGISTRY_USERNAME variable and GITLAB_REGISTRY_TOKEN secret are unavailable. These are not exposed to fork pull requests; run the private build from a branch in this repository, or clear XRPLD_PRIVATE_VERSION to use the default image." >&2
            exit 1
          fi

          echo "Using private xrpld image for version ${PRIVATE_VERSION}."
          {
            echo "image=${PRIVATE_IMAGE_REPO}:private-${PRIVATE_VERSION}"
            echo "is_private=true"
          } >> "${GITHUB_OUTPUT}"

  integration-test:
    name: Integration test
    needs: resolve_xrpld_image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XRPLD_DOCKER_IMAGE: ${{ needs.resolve_xrpld_image.outputs.image }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Load cached .local
        id: cache-poetry
        uses: actions/cache@v4
        with:
          path: /home/runner/.local
          key: dotlocal-${{ env.POETRY_VERSION }}

      - name: Log in to the private GitLab registry
        if: ${{ needs.resolve_xrpld_image.outputs.is_private == 'true' }}
        env:
          GITLAB_REGISTRY_USERNAME: ${{ vars.GITLAB_REGISTRY_USERNAME }}
          GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
        run: |
          printf '%s' "${GITLAB_REGISTRY_TOKEN}" | docker login registry.gitlab.com \
            --username "${GITLAB_REGISTRY_USERNAME}" \
            --password-stdin

      - name: Run docker in background
        run: |
          docker run \
            --detach \
            --publish 5005:5005 \
            --publish 6006:6006 \
            --volume "${{ github.workspace }}/.ci-config/":"/etc/xrpld/" \
            --name xrpld-service \
            "${XRPLD_DOCKER_IMAGE}" --standalone

      - name: Install poetry
        if: steps.cache-poetry.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://install.python-poetry.org/ | python - --version ${{ env.POETRY_VERSION }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python + Retrieve Poetry dependencies from cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"

      - name: Display Python version
        run: |
          python -c "import sys; print(sys.version)"

      - name: Install poetry dependencies
        run: poetry install

      - name: Integration test
        run: |
          poetry run poe test_integration
          poetry run coverage report --fail-under=70

      - name: Stop docker container
        if: always()
        run: docker logs xrpld-service && docker stop xrpld-service

  # ────────────────────────────────────────────────────────────────────────────
  # Confidential MPT (XLS-0096) native integration test — cross-platform matrix.
  #
  # The native add-on (xrpl.ext.confidential) ships as the separate
  # xrpl-py-confidential distribution and is NOT built by the core job above, so
  # tests/integration/.../test_confidential_mpt.py self-skips there. This matrix
  # builds the CFFI extension from source on each platform and runs the full
  # convert -> merge -> send -> convert-back -> clawback lifecycle for real,
  # validating the native layer (macOS @rpath dylib load, the Windows DLL) that
  # a compile-and-import smoke test would miss. Mirrors xrpl4j's
  # `build_confidential_native_its` (PR #810).
  #
  # Ledger source per row (chosen by what the runner can do):
  #   * local-rippled — runners with a Docker engine run the private xrpld image
  #     (ConfidentialTransfer amendment) as a standalone Testcontainer. ARM Linux
  #     emulates the amd64-only image via QEMU; macOS Intel gets Docker via Colima.
  #   * devnet — macOS ARM (no nested virt) and Windows (no Linux containers)
  #     cannot run the container, so they target Devnet via CONFIDENTIAL_IT_USE_DEVNET.
  #
  # Native provisioning is per-platform (CFFI compiles per Python version), so we
  # pin ONE Python per platform — the risk we de-risk is the native layer, which
  # is platform/arch-specific, not Python-version-specific. Pre-publish we build
  # the ext from source; once xrpl-py-confidential wheels are published this can
  # become `pip install xrpl-py-confidential`.
  #
  # NOTE: the devnet rows are `continue-on-error` (informational) until (a)
  # ConfidentialTransfer is confirmed enabled on public Devnet and (b) the
  # from-source CFFI build is shaken out on macOS-ARM / Windows runners.
  # ────────────────────────────────────────────────────────────────────────────
  confidential-integration-test:
    name: Confidential MPT IT · ${{ matrix.platform }} · ${{ matrix.network }}
    needs: resolve_xrpld_image
    # The local-rippled rows need the private image (ConfidentialTransfer). When
    # XRPLD_PRIVATE_VERSION is cleared (public default image), skip the whole
    # matrix rather than fail on a node without the amendment.
    if: ${{ needs.resolve_xrpld_image.outputs.is_private == 'true' }}
    continue-on-error: ${{ matrix.network == 'devnet' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Docker-native: local standalone rippled.
          - os: ubuntu-latest
            platform: linux-x86-64
            python: "3.11"
            network: local-rippled
          # amd64-only image runs under QEMU emulation on ARM Linux.
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            python: "3.11"
            network: local-rippled
            setup_qemu: true
          # No preinstalled Docker; Colima provides the engine.
          - os: macos-15-intel
            platform: darwin-x86-64
            python: "3.11"
            network: local-rippled
            setup_docker_via_colima: true
          # No nested virtualization -> Devnet.
          - os: macos-14
            platform: darwin-aarch64
            python: "3.11"
            network: devnet
          # No Linux containers -> Devnet.
          - os: windows-latest
            platform: win32-x86-64
            python: "3.11"
            network: devnet
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      XRPLD_DOCKER_IMAGE: ${{ needs.resolve_xrpld_image.outputs.image }}
      # `gh release download` of the mpt-crypto native bundle (public repo).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The confidential test reads this to target Devnet instead of localhost.
      CONFIDENTIAL_IT_USE_DEVNET: ${{ matrix.network == 'devnet' && 'true' || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      # ── Provide a Docker engine + rippled for the local-rippled rows ──
      - name: Set up QEMU (emulate the amd64 rippled image on ARM Linux)
        if: ${{ matrix.setup_qemu }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Set up Docker via Colima (macOS Intel)
        if: ${{ matrix.setup_docker_via_colima }}
        run: |
          brew install colima docker
          colima start --cpus 3 --memory 8
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"

      - name: Log in to the private GitLab registry
        if: ${{ matrix.network == 'local-rippled' }}
        env:
          GITLAB_REGISTRY_USERNAME: ${{ vars.GITLAB_REGISTRY_USERNAME }}
          GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
        run: |
          printf '%s' "${GITLAB_REGISTRY_TOKEN}" | docker login registry.gitlab.com \
            --username "${GITLAB_REGISTRY_USERNAME}" \
            --password-stdin

      - name: Run rippled (standalone)
        if: ${{ matrix.network == 'local-rippled' }}
        run: |
          docker run \
            --detach \
            --platform linux/amd64 \
            --publish 5005:5005 \
            --publish 6006:6006 \
            --volume "${{ github.workspace }}/.ci-config/":"/etc/xrpld/" \
            --name xrpld-service \
            "${XRPLD_DOCKER_IMAGE}" --standalone

      # ── Python + poetry (pipx is portable across all runners) ──
      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Install poetry dependencies
        run: poetry install

      # cffi is a BUILD-time dependency of the native extension only; it is
      # intentionally not a core xrpl-py dependency.
      - name: Install cffi (build-time only)
        run: poetry run pip install cffi

      # Windows needs the MSVC developer environment to compile the CFFI ext.
      - name: Set up MSVC (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1

      # Fetch the prebuilt libmpt-crypto for this platform from the pinned
      # mpt-crypto release into xrpl/ext/confidential/libs/.
      - name: Fetch pinned native mpt-crypto library
        run: |
          VERSION=$(grep -E '^MPT_CRYPTO_VERSION=' \
            xrpl/ext/confidential/MPT_CRYPTO_VERSION | cut -d= -f2)
          echo "Fetching mpt-crypto natives for pinned version ${VERSION}"
          ./xrpl/ext/confidential/setup_mpt_crypto.sh download --version "${VERSION}"

      - name: Build the CFFI extension
        run: poetry run python xrpl/ext/confidential/build_mpt_crypto.py

      # Fail loudly if the extension did not build/load, so the integration test
      # below cannot silently self-skip and report a false green.
      - name: Verify the native extension is available
        run: |
          poetry run python -c "from xrpl.ext.confidential import MPT_CRYPTO_AVAILABLE; assert MPT_CRYPTO_AVAILABLE, 'native mpt-crypto extension failed to build/load'; print('MPT_CRYPTO_AVAILABLE = True')"

      - name: Confidential MPT integration test
        run: |
          poetry run python -m unittest -v \
            tests.integration.transactions.test_confidential_mpt

      - name: rippled logs + stop
        if: ${{ always() && matrix.network == 'local-rippled' }}
        run: docker logs xrpld-service && docker stop xrpld-service
