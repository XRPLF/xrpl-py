name: Faucet tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      git_ref:
        description: "Git ref (branch, tag, or SHA) to test"
        required: false
        type: string
        default: ""

env:
  POETRY_VERSION: 2.5.1

jobs:
  faucet-test:
    name: Faucet test
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      # The installer builds Poetry's venv in ~/.local from the runner's own
      # Python, so a cache from another runner image can't run (a new
      # ubuntu-latest image broke the old key). Key it on that image and Python.
      - name: Compute Poetry cache key
        id: poetry-cache-key
        run: |
          echo "key=dotlocal-${ImageOS:-unknown}-${ImageVersion:-unknown}-$(python3 -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')-${{ env.POETRY_VERSION }}" >> "$GITHUB_OUTPUT"

      - name: Load cached .local
        id: cache-poetry
        uses: actions/cache@v4
        with:
          path: /home/runner/.local
          key: ${{ steps.poetry-cache-key.outputs.key }}

      - name: Install poetry
        if: steps.cache-poetry.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://install.python-poetry.org/ | python - --version ${{ env.POETRY_VERSION }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python + Retrieve Poetry dependencies from cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"

      - name: Display Python version
        run: |
          python -c "import sys; print(sys.version)"

      - name: Install poetry dependencies
        run: poetry install

      - name: Check virtualenv Python version
        run: |
          poetry run python -c "import sys; v = '%d.%d' % sys.version_info[:2]; print(sys.version); assert v == '${{ matrix.python-version }}', f'venv is Python {v}, expected ${{ matrix.python-version }}'"

      - name: Run Faucet tests
        run: poetry run poe test_faucet
