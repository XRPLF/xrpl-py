name: Run pre-commit hooks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-hooks:
    uses: XRPLF/actions/.github/workflows/pre-commit.yml@7a72fb65e893860c516215261572cdaf95b8705e
    with:
      runs_on: ubuntu-latest
      container: '{ "image": "ghcr.io/xrplf/xrpld/pre-commit:sha-d3a71b2" }'
      # The local hooks run the tool versions in poetry.lock.
      setup_command: pip install --index-url https://pypi.org/simple poetry==2.5.1 && poetry install
